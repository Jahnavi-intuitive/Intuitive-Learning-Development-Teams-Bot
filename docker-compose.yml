services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lnd_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-lnd_certification}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lnd_app} -d ${POSTGRES_DB:-lnd_certification}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lnd_app}:${POSTGRES_PASSWORD:-change_me_locally}@db:5432/${POSTGRES_DB:-lnd_certification}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TRACKER_XLSX_PATH: /data/trackers/certification_tracker.xlsx
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/data

volumes:
  postgres_data:
