databases:
  - name: lnd-db
    databaseName: lnd_certification
    user: lnd_app
    plan: free
    postgresMajorVersion: "16"

services:
  # Free-tier note: Render's private-service type (no public URL at all)
  # isn't eligible for a Free instance — only Web Service/Postgres/Key
  # Value/static sites are. So this is a public `type: web` service on
  # Free, same as lnd-backend. That's a real reduction in isolation vs.
  # the paid-plan design (see DEPLOYMENT.md's GCP version and the
  # `X-Internal-Service-Token` mechanism in backend/app/services/entra_auth.py) —
  # mitigated, not eliminated, by the fact that this agent has no
  # independent authority of its own: every sensitive check (who can see
  # what) still happens on lnd-backend, which the agent calls into exactly
  # like any other caller. Revisit `type: pserv` once this is on a paid plan.
  - name: lnd-agent
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./agent/Dockerfile
    dockerContext: ./agent
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      # Set manually after both services exist — see RENDER_DEPLOY.md.
      # Not wired via fromService: free web services can't receive
      # Render's private-network traffic, so this has to be each
      # service's plain public https://...onrender.com URL instead.
      - key: BACKEND_URL
        value: placeholder
        sync: false

  - name: lnd-backend
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lnd-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      # Set manually after both services exist — see RENDER_DEPLOY.md
      # (same reason as lnd-agent's BACKEND_URL above).
      - key: AGENT_URL
        value: placeholder
        sync: false
      - key: AUTH_MODE
        value: header
      # See the deployment doc's security note: "header" mode trusts
      # X-Employee-Id at face value, same as local dev — fine while this
      # URL isn't shared, not fine for anyone else who finds it. Switch to
      # AUTH_MODE=entra (see backend/app/services/entra_auth.py) before
      # sharing this deployment with anyone else.
      - key: NOTIFICATION_SWEEP_ENABLED
        value: "true"
      - key: SWEEP_TRIGGER_SECRET
        generateValue: true
